<!DOCTYPE html>
<html>
<head>
  <base href="/hexrush/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HexRush - İzometrik Altıgen Fetih ve Strateji Oyunu">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HexRush">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HexRush | İzometrik Bozkır Stratejisi</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #060913;
      background-image: 
        radial-gradient(#1E293B 1px, transparent 1px),
        linear-gradient(to right, rgba(51, 65, 85, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(51, 65, 85, 0.08) 1px, transparent 1px);
      background-size: 24px 24px, 48px 48px, 48px 48px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
    }

    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 90%;
      max-width: 380px;
    }

    /* Neo-Brutalist Monolith Card */
    .neo-card {
      width: 100%;
      background: #0F172A;
      border: 3px solid #334155;
      padding: 22px 20px;
      box-shadow: 5px 5px 0px #020617;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Corner Bracket Accents */
    .corner-bracket {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: #D97706;
      border-style: solid;
      pointer-events: none;
    }
    .corner-tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
    .corner-tr { top: -2px; right: -2px; border-width: 3px 3px 0 0; }
    .corner-bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; }
    .corner-br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }

    /* 3D Isometric Voxel Karo & Tamga Visualization */
    .voxel-loader-wrapper {
      position: relative;
      width: 140px;
      height: 130px;
      margin: 6px 0 12px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .voxel-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Animations */
    @keyframes floatCube1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatCube2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
    @keyframes floatCube3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes runeGlow {
      0%, 100% { opacity: 0.75; filter: drop-shadow(0 0 2px #D97706); }
      50% { opacity: 1.0; filter: drop-shadow(0 0 6px #FFC700); }
    }
    @keyframes scanSweep {
      0% { stroke-dashoffset: 280; opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }

    .cube-anim-1 { animation: floatCube1 2.2s ease-in-out infinite; }
    .cube-anim-2 { animation: floatCube2 2.6s ease-in-out infinite 0.4s; }
    .cube-anim-3 { animation: floatCube3 2.0s ease-in-out infinite 0.8s; }
    .tamga-rune { animation: runeGlow 2.0s ease-in-out infinite; }
    .scan-border {
      stroke-dasharray: 60 220;
      animation: scanSweep 3.0s linear infinite;
    }

    /* Telemetry Header */
    .telemetry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 10px;
      border-bottom: 2px solid #334155;
      padding-bottom: 8px;
    }

    .telemetry-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #F8FAFC;
      font-family: monospace;
    }

    .telemetry-tag {
      background: #D97706;
      color: #020617;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 6px;
      letter-spacing: 0.5px;
      border: 1.5px solid #000;
      box-shadow: 2px 2px 0px #020617;
    }

    /* Segmented Rectangular Progress Bar */
    .progress-track {
      width: 100%;
      height: 16px;
      background: #020617;
      border: 2px solid #334155;
      padding: 2px;
      display: flex;
      gap: 3px;
      margin-bottom: 10px;
    }

    .progress-segment {
      flex: 1;
      height: 100%;
      background: #1E293B;
      animation: fillSegment 1.6s infinite ease-in-out;
    }

    .progress-segment:nth-child(1) { animation-delay: 0.0s; }
    .progress-segment:nth-child(2) { animation-delay: 0.15s; }
    .progress-segment:nth-child(3) { animation-delay: 0.3s; }
    .progress-segment:nth-child(4) { animation-delay: 0.45s; }
    .progress-segment:nth-child(5) { animation-delay: 0.6s; }
    .progress-segment:nth-child(6) { animation-delay: 0.75s; }
    .progress-segment:nth-child(7) { animation-delay: 0.9s; }
    .progress-segment:nth-child(8) { animation-delay: 1.05s; }

    @keyframes fillSegment {
      0%, 20% { background: #1E293B; }
      40%, 80% { background: #D97706; }
      90%, 100% { background: #FFC700; }
    }

    /* Subtext Status */
    .status-text {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #94A3B8;
      font-family: monospace;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .blink-dot {
      width: 6px;
      height: 6px;
      background: #10B981;
      display: inline-block;
      animation: blink 1s step-end infinite;
    }

    .telemetry-fps {
      color: #D97706;
      font-weight: 900;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="neo-card">
      <div class="corner-bracket corner-tl"></div>
      <div class="corner-bracket corner-tr"></div>
      <div class="corner-bracket corner-bl"></div>
      <div class="corner-bracket corner-br"></div>

      <div class="telemetry-header">
        <div class="telemetry-title">HEXRUSH // KADİM BOZKIR</div>
        <div class="telemetry-tag">VOKSEL</div>
      </div>

      <!-- 3D Isometric Voxel Hex Tile with Khaganate Tamga & Floating Voxels -->
      <div class="voxel-loader-wrapper">
        <svg class="voxel-svg" viewBox="0 0 140 130" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- 3D Extruded Left Bedrock Wall -->
          <polygon points="18,65 70,95 70,118 18,88" fill="#0F172A" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
          <line x1="35" y1="74" x2="35" y2="98" stroke="#1E293B" stroke-width="1.5"/>
          <line x1="52" y1="84" x2="52" y2="108" stroke="#1E293B" stroke-width="1.5"/>

          <!-- 3D Extruded Right Bedrock Wall -->
          <polygon points="70,95 122,65 122,88 70,118" fill="#090D1A" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
          <line x1="88" y1="84" x2="88" y2="108" stroke="#1E293B" stroke-width="1.5"/>
          <line x1="105" y1="74" x2="105" y2="98" stroke="#1E293B" stroke-width="1.5"/>

          <!-- Hexagon Top Isometric Surface -->
          <polygon points="70,35 122,65 70,95 18,65" fill="#1E293B" stroke="#D97706" stroke-width="2.5" stroke-linejoin="round"/>

          <!-- Steppe Inner Isometric Inset -->
          <polygon points="70,43 110,65 70,87 30,65" fill="#0F172A" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/>

          <!-- Animated Gold Radar Scanline on Hex Perimeter -->
          <polygon class="scan-border" points="70,35 122,65 70,95 18,65" fill="none" stroke="#FFC700" stroke-width="3" stroke-linecap="round"/>

          <!-- Authentic Göktürk Kağanlık Tamgası (Pulsing Center Rune) -->
          <g class="tamga-rune">
            <!-- Center Vertical Spine -->
            <line x1="70" y1="52" x2="70" y2="78" stroke="#FFC700" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Top Bow Arms (Kağanlık Yayı) -->
            <polyline points="59,57 70,52 81,57" fill="none" stroke="#FFC700" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Middle Cross Branch (Kut Rünü) -->
            <line x1="62" y1="65" x2="78" y2="65" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/>
            <!-- Bottom Anchor Arms (Tengri Dağ Rünü) -->
            <polyline points="59,73 70,78 81,73" fill="none" stroke="#FFC700" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <!-- Floating Voxel Cube 1 (Food / Amber) -->
          <g class="cube-anim-1">
            <!-- Top -->
            <polygon points="40,24 49,29 40,34 31,29" fill="#FBBF24" stroke="#78350F" stroke-width="1"/>
            <!-- Left -->
            <polygon points="31,29 40,34 40,43 31,38" fill="#D97706" stroke="#78350F" stroke-width="1"/>
            <!-- Right -->
            <polygon points="40,34 49,29 49,38 40,43" fill="#B45309" stroke="#78350F" stroke-width="1"/>
          </g>

          <!-- Floating Voxel Cube 2 (Timber / Pine Green) -->
          <g class="cube-anim-2">
            <!-- Top -->
            <polygon points="70,8 79,13 70,18 61,13" fill="#34D399" stroke="#064E3B" stroke-width="1"/>
            <!-- Left -->
            <polygon points="61,13 70,18 70,27 61,22" fill="#10B981" stroke="#064E3B" stroke-width="1"/>
            <!-- Right -->
            <polygon points="70,18 79,13 79,22 70,27" fill="#047857" stroke="#064E3B" stroke-width="1"/>
          </g>

          <!-- Floating Voxel Cube 3 (Sky Iron / Lapis) -->
          <g class="cube-anim-3">
            <!-- Top -->
            <polygon points="100,24 109,29 100,34 91,29" fill="#60A5FA" stroke="#1E3A8A" stroke-width="1"/>
            <!-- Left -->
            <polygon points="91,29 100,34 100,43 91,38" fill="#3B82F6" stroke="#1E3A8A" stroke-width="1"/>
            <!-- Right -->
            <polygon points="100,34 109,29 109,38 100,43" fill="#1D4ED8" stroke="#1E3A8A" stroke-width="1"/>
          </g>
        </svg>
      </div>

      <!-- Stepped Segmented Progress -->
      <div class="progress-track">
        <div class="progress-segment"></div>
        <div class="progress-segment"></div>
        <div class="progress-segment"></div>
        <div class="progress-segment"></div>
        <div class="progress-segment"></div>
        <div class="progress-segment"></div>
        <div class="progress-segment"></div>
        <div class="progress-segment"></div>
      </div>

      <div class="status-text">
        <div class="status-left">
          <span class="blink-dot"></span>
          <span>KADİM MATRİS BAŞLATILIYOR...</span>
        </div>
        <span class="telemetry-fps">60 FPS // ZERO-GC</span>
      </div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
